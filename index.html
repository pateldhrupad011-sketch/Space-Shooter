<!DOCTYPE html>
<html>
<head>
  <title>Space Shooter</title>
  <style>
    body {
      background: #05050f;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    canvas {
      border: 3px solid #333;
    }
  </style>
</head>
<body>
  <canvas id="game" width="480" height="640"></canvas>

  <script>
    var canvas = document.getElementById("game");
    var ctx = canvas.getContext("2d");

    var shipX = 240;
    var shipY = 590;
    var shipSpeed = 5;
    var keys = {};

    document.addEventListener("keydown", function (e) {
      keys[e.key] = true;
      if (e.key == "ArrowLeft" || e.key == "ArrowRight" || e.key == " ") {
        e.preventDefault();
      }
    });

    document.addEventListener("keyup", function (e) {
      keys[e.key] = false;
    });

    function update() {
      if (keys["ArrowLeft"]) {
        shipX -= shipSpeed;
      }
      if (keys["ArrowRight"]) {
        shipX += shipSpeed;
      }

      // don't let the ship leave the screen
      if (shipX < 20) {
        shipX = 20;
      }
      if (shipX > 460) {
        shipX = 460;
      }
    }

    function draw() {
      ctx.fillStyle = "black";
      ctx.fillRect(0, 0, 480, 640);

      // ship
      ctx.fillStyle = "cyan";
      ctx.beginPath();
      ctx.moveTo(shipX, shipY - 20);
      ctx.lineTo(shipX - 20, shipY + 20);
      ctx.lineTo(shipX + 20, shipY + 20);
      ctx.fill();
    }

    setInterval(function () {
      update();
      draw();
    }, 16);
  </script>
</body>
</html>

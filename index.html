<!DOCTYPE html>
<html>
<head>
  <title>Space Shooter</title>
  <style>
    body {
      background: #05050f;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    canvas {
      border: 3px solid #333;
    }
  </style>
</head>
<body>
  <canvas id="game" width="480" height="640"></canvas>

  <script>
    var canvas = document.getElementById("game");
    var ctx = canvas.getContext("2d");

    var shipX = 240;
    var shipY = 590;
    var shipSpeed = 5;
    var keys = {};
    var bullets = [];
    var bulletSpeed = 8;
    var canShoot = true;
    var score = 0;

    var enemies = [];
    var enemySpeed = 1.5;
    var enemyDir = 1;

    function makeEnemyRow() {
      for (var col = 0; col < 6; col++) {
        enemies.push({x: 60 + col * 65, y: 60, alive: true});
      }
    }
    makeEnemyRow();

    document.addEventListener("keydown", function (e) {
      keys[e.key] = true;
      if (e.key == "ArrowLeft" || e.key == "ArrowRight" || e.key == " ") {
        e.preventDefault();
      }
      if (e.key == " " && canShoot) {
        bullets.push({x: shipX, y: shipY - 20});
        canShoot = false;
      }
    });

    document.addEventListener("keyup", function (e) {
      keys[e.key] = false;
      if (e.key == " ") {
        canShoot = true;
      }
    });

    function update() {
      if (keys["ArrowLeft"]) {
        shipX -= shipSpeed;
      }
      if (keys["ArrowRight"]) {
        shipX += shipSpeed;
      }
      if (shipX < 20) {
        shipX = 20;
      }
      if (shipX > 460) {
        shipX = 460;
      }

      // move bullets up
      for (var i = bullets.length - 1; i >= 0; i--) {
        bullets[i].y -= bulletSpeed;
        if (bullets[i].y < 0) {
          bullets.splice(i, 1);
        }
      }

      // move enemies side to side, drop down at the edges
      var hitEdge = false;
      for (var i = 0; i < enemies.length; i++) {
        if (!enemies[i].alive) {
          continue;
        }
        enemies[i].x += enemySpeed * enemyDir;
        if (enemies[i].x < 30 || enemies[i].x > 450) {
          hitEdge = true;
        }
      }
      if (hitEdge) {
        enemyDir *= -1;
        for (var i = 0; i < enemies.length; i++) {
          enemies[i].y += 20;
        }
      }

      // check if a bullet hit an enemy
      for (var b = bullets.length - 1; b >= 0; b--) {
        for (var e = 0; e < enemies.length; e++) {
          if (!enemies[e].alive) {
            continue;
          }
          var dx = bullets[b].x - enemies[e].x;
          var dy = bullets[b].y - enemies[e].y;
          var dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < 25) {
            enemies[e].alive = false;
            bullets.splice(b, 1);
            score += 10;
            break;
          }
        }
      }
    }

    function draw() {
      ctx.fillStyle = "black";
      ctx.fillRect(0, 0, 480, 640);

      // ship
      ctx.fillStyle = "cyan";
      ctx.beginPath();
      ctx.moveTo(shipX, shipY - 20);
      ctx.lineTo(shipX - 20, shipY + 20);
      ctx.lineTo(shipX + 20, shipY + 20);
      ctx.fill();

      // bullets
      ctx.fillStyle = "yellow";
      for (var i = 0; i < bullets.length; i++) {
        ctx.fillRect(bullets[i].x - 2, bullets[i].y - 8, 4, 16);
      }

      // enemies
      ctx.fillStyle = "#ff4d4d";
      for (var i = 0; i < enemies.length; i++) {
        if (enemies[i].alive) {
          ctx.fillRect(enemies[i].x - 18, enemies[i].y - 15, 36, 30);
        }
      }

      // score
      ctx.fillStyle = "white";
      ctx.font = "24px Arial";
      ctx.fillText("Score: " + score, 15, 30);
    }

    setInterval(function () {
      update();
      draw();
    }, 16);
  </script>
</body>
</html>

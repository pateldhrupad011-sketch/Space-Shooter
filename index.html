<!DOCTYPE html>
<html>
<head>
  <title>Space Shooter</title>
  <style>
    body {
      background: #05050f;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    canvas {
      border: 3px solid #333;
    }
  </style>
</head>
<body>
  <canvas id="game" width="480" height="640"></canvas>

  <script>
    var canvas = document.getElementById("game");
    var ctx = canvas.getContext("2d");
    var w = 480;
    var h = 640;

    var shipX = 240;
    var shipY = 590;
    var shipSpeed = 5;
    var keys = {};
    var bullets = [];
    var bulletSpeed = 8;
    var canShoot = true;
    var score = 0;
    var started = false;

    var enemies = [];
    var enemySpeed = 1.5;
    var enemyDir = 1;

    // start screen panel and button
    var panelW = 360;
    var panelX = (w - panelW) / 2;
    var panelY = h / 2 - 140;
    var btnX = w / 2 - 80;
    var btnY = panelY + 190;
    var btnW = 160;
    var btnH = 50;

    function makeEnemyRow() {
      for (var col = 0; col < 6; col++) {
        enemies.push({x: 60 + col * 65, y: 60, alive: true});
      }
    }
    makeEnemyRow();

    document.addEventListener("keydown", function (e) {
      keys[e.key] = true;
      if (e.key == "ArrowLeft" || e.key == "ArrowRight" || e.key == " ") {
        e.preventDefault();
      }

      // start screen: space or enter starts the game
      if (!started) {
        if (e.key == " " || e.key == "Enter") {
          started = true;
        }
        return;
      }

      if (e.key == " " && canShoot) {
        bullets.push({x: shipX, y: shipY - 20});
        canShoot = false;
      }
    });

    document.addEventListener("keyup", function (e) {
      keys[e.key] = false;
      if (e.key == " ") {
        canShoot = true;
      }
    });

    // clicking the start button
    canvas.addEventListener("click", function (e) {
      if (started) {
        return;
      }
      var rect = canvas.getBoundingClientRect();
      var mx = e.clientX - rect.left - canvas.clientLeft;
      var my = e.clientY - rect.top - canvas.clientTop;
      if (mx > btnX && mx < btnX + btnW && my > btnY && my < btnY + btnH) {
        started = true;
      }
    });

    function update() {
      if (!started) {
        return;
      }

      if (keys["ArrowLeft"]) {
        shipX -= shipSpeed;
      }
      if (keys["ArrowRight"]) {
        shipX += shipSpeed;
      }
      if (shipX < 20) {
        shipX = 20;
      }
      if (shipX > 460) {
        shipX = 460;
      }

      // move bullets up
      for (var i = bullets.length - 1; i >= 0; i--) {
        bullets[i].y -= bulletSpeed;
        if (bullets[i].y < 0) {
          bullets.splice(i, 1);
        }
      }

      // move enemies side to side, drop down at the edges
      var hitEdge = false;
      for (var i = 0; i < enemies.length; i++) {
        if (!enemies[i].alive) {
          continue;
        }
        enemies[i].x += enemySpeed * enemyDir;
        if (enemies[i].x < 30 || enemies[i].x > 450) {
          hitEdge = true;
        }
      }
      if (hitEdge) {
        enemyDir *= -1;
        for (var i = 0; i < enemies.length; i++) {
          enemies[i].y += 20;
        }
      }

      // check if a bullet hit an enemy
      for (var b = bullets.length - 1; b >= 0; b--) {
        for (var e = 0; e < enemies.length; e++) {
          if (!enemies[e].alive) {
            continue;
          }
          var dx = bullets[b].x - enemies[e].x;
          var dy = bullets[b].y - enemies[e].y;
          var dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < 25) {
            enemies[e].alive = false;
            bullets.splice(b, 1);
            score += 10;
            break;
          }
        }
      }
    }

    function draw() {
      ctx.fillStyle = "black";
      ctx.fillRect(0, 0, w, h);

      // ship
      ctx.fillStyle = "cyan";
      ctx.beginPath();
      ctx.moveTo(shipX, shipY - 20);
      ctx.lineTo(shipX - 20, shipY + 20);
      ctx.lineTo(shipX + 20, shipY + 20);
      ctx.fill();

      // bullets
      ctx.fillStyle = "yellow";
      for (var i = 0; i < bullets.length; i++) {
        ctx.fillRect(bullets[i].x - 2, bullets[i].y - 8, 4, 16);
      }

      // enemies
      ctx.fillStyle = "#ff4d4d";
      for (var i = 0; i < enemies.length; i++) {
        if (enemies[i].alive) {
          ctx.fillRect(enemies[i].x - 18, enemies[i].y - 15, 36, 30);
        }
      }

      // score
      ctx.fillStyle = "white";
      ctx.font = "24px Arial";
      ctx.textAlign = "left";
      ctx.fillText("Score: " + score, 15, 30);

      if (!started) {
        // start screen
        ctx.fillStyle = "black";
        ctx.beginPath();
        ctx.roundRect(panelX, panelY, panelW, 280, 15);
        ctx.fill();
        ctx.strokeStyle = "cyan";
        ctx.lineWidth = 3;
        ctx.stroke();

        ctx.textAlign = "center";
        ctx.fillStyle = "white";
        ctx.font = "bold 40px Arial";
        ctx.fillText("SPACE SHOOTER", w / 2, panelY + 50);
        ctx.font = "20px Arial";
        ctx.fillText("Use arrow keys to move", w / 2, panelY + 100);
        ctx.fillText("Press SPACE to shoot", w / 2, panelY + 130);

        // start button
        ctx.fillStyle = "cyan";
        ctx.beginPath();
        ctx.roundRect(btnX, btnY, btnW, btnH, 10);
        ctx.fill();
        ctx.fillStyle = "black";
        ctx.font = "bold 26px Arial";
        ctx.fillText("START", w / 2, btnY + 33);
        ctx.fillStyle = "#c8c8c8";
        ctx.font = "14px Arial";
        ctx.fillText("or press SPACE", w / 2, btnY + 75);
      }
    }

    setInterval(function () {
      update();
      draw();
    }, 16);
  </script>
</body>
</html>
